const bar=v=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`,pill=t=>`<span class="pill p-${t[0].toLowerCase()==='v'?'h':t[0].toLowerCase()==='n'||t==='Done'?'n':t[0].toLowerCase()}">${t}</span>`;
const chips=(f,o)=>o.map(x=>`<button class="chip ${S[f].includes(x)?'on':''}" onclick="tog('${f}','${x}')">${x}</button>`).join('');
const ring=v=>`<div class="ring" style="background:conic-gradient(var(--pl) ${v*3.6}deg,var(--soft) 0)"><span>${v}%</span></div>`;
let T=null,IV=null,TM=null,CS=null;
window.go=v=>{S.view=v;save();render();scrollTo(0,0)};window.tog=(f,v)=>{const a=S[f];a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);save();render()};
window.setp=(k,v)=>{S.p[k]=v;save()};window.setv=(k,v)=>{S[k]=isNaN(v)||v===''?v:+v;save()};window.setsk=(k,v)=>{S.skills[k]=+v;save()};
window.wiz=n=>{S.step=Math.max(0,Math.min(3,n));save();render()};
window.finish=()=>{S.assessed=true;if(!S.goal)S.goal='';save();go('careers')};
window.resetAssess=()=>{if(confirm('Reset assessment answers and test results?')){Object.assign(S,{work:'Product Dev',strong:[],weak:[],soft:[],ps:3,comm:3,acad:70,assessed:false,sc:{},step:8,pref:'',goal:''});save();go('profile')}};
window.setGoal=id=>{S.goal=id;save();go('map')};window.done=t=>{complete(t);save();render()};
window.pj=(id,s)=>{S.pj[id]=s;save();render()};window.tab=t=>{S.tab=t;T=null;IV=null;clearInterval(TM);save();render()};
window.demo=n=>{const d=DEMO[n];S=Object.assign(blank(),JSON.parse(JSON.stringify(d)),{done:{},pj:{},goal:'',view:'dashboard',step:3});save();render()};
window.hardReset=()=>{if(confirm('Erase all data?')){S=blank();save();render()}};
window.saveComp=()=>{try{S.comp=JSON.parse($('compj').value);save();alert('Company configuration saved')}catch(e){alert('Invalid JSON')}};
function nav(){const icons={dashboard:'⌂',roadmap:'◫',careers:'⌕',projects:'▣',placement:'◎',resume:'▤',assistant:'✦',profile:'◉',map:'⌘',gap:'▥'};
 const item=k=>`<button class="nav ${S.view===k?'on':''}" onclick="go('${k}');sb.classList.remove('open')"><span class="nav-icon" aria-hidden="true">${icons[k]}</span><span class="nav-label">${V[k]}</span></button>`;
 const primary=['dashboard','roadmap','careers','projects','placement','resume','assistant','profile'];
 const secondary=['map','gap'];
 $('nav').innerHTML=`<div class="nav-groups"><div class="nav-primary">${primary.map(item).join('')}</div><div class="nav-divider" role="separator"></div><div class="nav-secondary">${secondary.map(item).join('')}</div></div>`}
function head(){const s=S.view;$('title').textContent=V[s];$('crumb').innerHTML=`<a onclick="go('dashboard')">Home</a> › ${V[s]}${s!=='dashboard'?' · <a onclick="history.back?go(\'dashboard\'):0">← Back to dashboard</a>':''}`;$('saved').textContent=S.savedAt?'Saved '+new Date(S.savedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Not saved yet'}
function dash(){const id=goal(),c=C[id],m=matches(),top=m.find(x=>x.id===id),g=gaps().filter(x=>x.g>0).slice(0,4),rd=roadmap(),dn=rd.filter(x=>x.done).length,sr=skillReady(),pp=placePct(),na=nextAction(),nt=nextTopic(id),pr=projects()[0],sc=S.sc;
 return`${S.view&&S.assessed?'':`<div class="banner"><span>👋 Complete your profile to unlock personalised results, or load a demo student.</span><button class="btn sm2" onclick="go('profile')">Start profile</button></div>`}
<div class="card" style="background:linear-gradient(135deg,var(--pr),var(--pl));color:#fff"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><div class="sm" style="opacity:.8">Where am I now?</div><div class="big">${S.p.name?'Hi, '+esc(S.p.name):'Welcome'} · ${esc(S.p.branch)}, ${esc(S.p.year)} year</div><div>Stage: <b>${stage()}</b> · Profile ${profPct()}% complete</div></div><div style="text-align:right"><div class="sm" style="opacity:.8">Recommended next action</div><b>${na[0]}</b><br><button class="btn sm2 alt" style="margin-top:8px" onclick="go('${na[1]}')">Go →</button></div></div></div>
<div class="grid g4 mt"><div class="card"><div class="mu sm">Best-fit career</div><div class="big" style="font-size:19px">${c.n}</div><div class="sm">${top.pct}% match ${S.goal?'(your goal)':''}</div></div><div class="card"><div class="mu sm">Skill level / readiness</div><div class="big">${sr}%</div>${bar(sr)}</div><div class="card"><div class="mu sm">Assessment score</div><div class="big">${S.assessed?top.pct+'%':'—'}</div><div class="sm">${S.assessed?'Career fit from your answers':'Not completed'}</div></div><div class="card"><div class="mu sm">Placement readiness</div><div class="big">${pp}%</div>${bar(pp)}</div></div>
<div class="grid g3 mt"><div class="card"><h3>What skills am I missing?</h3>${g.length?g.map(x=>`<div class="sm">${x.k} <span class="mu">${x.cur}/${x.r}</span> ${pill(x.pr)}</div>${bar(100*x.cur/x.r)}`).join('<div style="height:6px"></div>'):'🎉 No gaps for this career'}<button class="btn alt sm2 mt" onclick="go('gap')">Full analysis</button></div>
<div class="card"><h3>Learning progress</h3><div style="display:flex;gap:14px;align-items:center">${ring(pc(dn,rd.length))}<div class="sm">${dn}/${rd.length} topics done<br><b>Next:</b> ${nt?nt.t:'All done'}</div></div><button class="btn alt sm2 mt" onclick="go('roadmap')">Open roadmap</button></div>
<div class="card"><h3>Project to build</h3><b>${pr.t}</b><div class="sm mu">${pr.d} · ${pr.T.join(', ')}</div><div class="sm" style="margin-top:6px">${S.pj[pr.id]==='done'?'✅ Completed':S.pj[pr.id]==='doing'?'🛠 In progress':'Not started'}</div><button class="btn alt sm2 mt" onclick="go('projects')">View projects</button></div></div>
<div class="grid g2 mt"><div class="card"><h3>Career roadmap progress</h3>${rd.slice(0,6).map(x=>`<div class="sm" style="margin:4px 0">${x.done?'✅':'⬜'} ${x.t}</div>`).join('')}</div><div class="card"><h3>Placement preparation</h3>${[['Aptitude',sc.apt],['Technical',sc.tech],['Coding',sc.code],['Interview',sc.int]].map(([n,v])=>`<div class="sm">${n} <b>${v?v.pct+'%':'not taken'}</b></div>${bar(v?v.pct:0)}`).join('<div style="height:6px"></div>')}</div></div>`}
function wizard(){const st=['Basics','Interests & Goals','Skills & Subjects','Assessment'],n=S.step;let h=`<div class="steps">${st.map((x,i)=>`<div class="step ${i===n?'on':i<n?'ok':''}" style="cursor:pointer" onclick="wiz(${i})">${i<n?'✓ ':''}${i+1}. ${x}</div>`).join('')}</div>${S.assessed?`<div class="banner"><span>Assessment completed. You can edit any step — results update automatically.</span><button class="btn red sm2" onclick="resetAssess()">Reset assessment</button></div>`:''}<div class="card">`;
 if(n==0)h+=`<h3>Personal & education</h3><div class="grid g2"><div><label>Name</label><input value="${esc(S.p.name)}" oninput="setp('name',this.value)"></div><div><label>Branch</label><select onchange="setp('branch',this.value)">${Object.keys(BR).map(b=>`<option ${S.p.branch==b?'selected':''}>${b}</option>`)}</select></div><div><label>Year</label><select onchange="setp('year',this.value)">${['1st','2nd','3rd','4th'].map(b=>`<option ${S.p.year==b?'selected':''}>${b}</option>`)}</select></div><div><label>CGPA (0–10)</label><input type="number" step=".1" min="0" max="10" value="${esc(S.p.cgpa)}" oninput="setp('cgpa',+this.value);S.acad=Math.round(this.value*10);save()"></div></div>`;
 if(n==1)h+=`<h3>Interests</h3>${chips('int',INT)}<h3 class="mt">Programming interests</h3>${chips('prog',PROG)}<label>Career preference (optional)</label><select onchange="setv('pref',this.value)"><option value="">No preference</option>${Object.entries(C).map(([k,c])=>`<option value="${k}" ${S.pref==k?'selected':''}>${c.n}</option>`)}</select><label>Preferred work type</label>${WORK.map(w=>`<button class="chip ${S.work==w?'on':''}" onclick="S.work='${w}';save();render()">${w}</button>`).join('')}`;
 if(n==2)h+=`<h3>Skill levels (0 = none, 5 = expert)</h3><div class="grid g4">${SK.map(k=>`<div><label>${k}: <b id="v_${k.replace(/\W/g,'')}">${lv(k)}</b></label><input type="range" min="0" max="5" value="${lv(k)}" oninput="setsk('${k}',this.value);document.getElementById('v_${k.replace(/\W/g,'')}').textContent=this.value"></div>`).join('')}</div><h3 class="mt">Strong subjects</h3>${chips('strong',SUBJ)}<h3 class="mt">Weak subjects</h3>${chips('weak',SUBJ)}`;
 if(n==3)h+=`<h3>Abilities</h3><div class="grid g3"><div><label>Problem-solving: <b>${S.ps}</b>/5</label><input type="range" min="1" max="5" value="${S.ps}" oninput="setv('ps',this.value);this.previousElementSibling.querySelector('b').textContent=this.value"></div><div><label>Communication: <b>${S.comm}</b>/5</label><input type="range" min="1" max="5" value="${S.comm}" oninput="setv('comm',this.value)"></div><div><label>Academic performance %</label><input type="number" min="0" max="100" value="${S.acad}" oninput="setv('acad',this.value)"></div></div><h3 class="mt">Soft skills</h3>${chips('soft',SOFT)}`;
 return h+`<div class="nav2"><button class="btn alt" onclick="wiz(${n-1})" ${n==0?'disabled':''}>← Back</button>${n<3?`<button class="btn" onclick="wiz(${n+1})">Save & Continue →</button>`:`<button class="btn" onclick="finish()">Save & See Recommendations →</button>`}</div></div>`}
function careers(){if(!S.assessed)return`<div class="card">Complete the assessment first. <button class="btn" onclick="go('profile')">Go to assessment</button></div>`;const m=matches(),id=goal();
 return`<div class="grid">${m.slice(0,4).map((x,i)=>{const c=C[x.id],g=gaps(x.id),have=g.filter(y=>y.cur>0),miss=g.filter(y=>y.g>0);return`<div class="card" ${x.id===id?'style="border:2px solid var(--pl)"':''}><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h3 style="margin:0">#${i+1} ${x.n} ${x.id===id?pill('Your goal'):''}</h3><div class="sm mu">${x.pct}% match</div></div>${ring(x.pct)}</div><div class="grid g3 mt"><div><b class="sm">Why recommended</b>${x.R.map(r=>`<div class="sm">• ${r}</div>`).join('')||'<div class="sm mu">Limited signals — add interests/skills</div>'}</div><div><b class="sm">Required vs current</b>${g.map(y=>`<div class="sm">${y.k}: ${y.cur}/${y.r}</div>`).join('')}</div><div><b class="sm">Missing skills</b>${miss.map(y=>`<div class="sm bad">• ${y.k}</div>`).join('')||'<div class="sm ok">None</div>'}<b class="sm" style="display:block;margin-top:8px">Next steps</b><div class="sm">1. Learn ${miss[0]?miss[0].k:'advanced topics'}<br>2. Build ${C[x.id].proj[0].split('|')[0]}</div></div></div><button class="btn ${x.id===id?'alt':''} mt" onclick="setGoal('${x.id}')">${x.id===id?'View career map →':'Set as my goal →'}</button></div>`}).join('')}</div><div class="nav2"><button class="btn alt" onclick="go('profile')">← Edit answers</button><button class="btn" onclick="go('map')">Next: Career Map →</button></div>`}
function map(){const id=goal(),c=C[id],g=gaps(),miss=g.filter(x=>x.g>0),nt=nextTopic(id),pj=projects()[0],co=S.co;const N=[['Student profile',`${esc(S.p.name||'Student')} · ${esc(S.p.branch)} · CGPA ${esc(S.p.cgpa)}<br>Interests: ${S.int.join(', ')||'—'}`],['Current skills',Object.entries(S.skills).filter(x=>x[1]>0).map(x=>x.join(' ')).join(', ')||'None added'],['Skill gaps',miss.slice(0,3).map(x=>x.k+' (-'+x.g+')').join(', ')||'No gaps'],['Required skills',Object.entries(c.req).map(x=>x.join(' ')+'/5').join(', ')],['Learning',(nt?nt.t:'Complete')+'<br>'+c.res],['Projects',pj.t+'<br>'+c.tools],['Assessment',['apt','tech','code','int'].map(k=>k+': '+(S.sc[k]?S.sc[k].pct+'%':'—')).join(' · ')+'<br>Certs: '+c.certs],['Internship',c.intern],['Placement',c.place+(co?'<br>Target: '+co:'')]];
 return`<div class="card"><h3>${c.n} — personalised path</h3><div class="flow">${N.map((n,i)=>`<div class="node"><b>${i+1}. ${n[0]}</b><div class="sm">${n[1]}</div></div>`).join('')}</div></div><div class="grid g3 mt"><div class="card"><h3>Subjects</h3>${c.subj.map(s=>`<span class="chip ${S.strong.includes(s)?'on':''}">${s}</span>`).join('')}</div><div class="card"><h3>Tools</h3><div class="sm">${c.tools}</div></div><div class="card"><h3>Certifications</h3><div class="sm">${c.certs}</div></div></div><div class="nav2"><button class="btn alt" onclick="go('careers')">← Recommendations</button><button class="btn" onclick="go('gap')">Next: Skill Gaps →</button></div>`}
function gap(){const id=goal(),g=gaps();return`<div class="card"><h3>${C[id].n}: current vs required <span class="mu sm">(change career in Recommendations)</span></h3><div style="overflow:auto"><table><tr><th>Skill</th><th>Current</th><th>Required</th><th>Gap</th><th>Priority</th><th style="width:25%">Progress</th></tr>${g.map(x=>`<tr><td><b>${x.k}</b></td><td>${x.cur}/5</td><td>${x.r}/5</td><td>${pill(x.gl)}</td><td>${pill(x.pr)}</td><td>${bar(100*x.cur/x.r)}</td></tr>`).join('')}</table></div></div><div class="nav2"><button class="btn alt" onclick="go('map')">← Career Map</button><button class="btn" onclick="go('roadmap')">Next: Roadmap →</button></div>`}
function road(){const rd=roadmap(),nt=rd.find(x=>!x.done),dn=rd.filter(x=>x.done).length;return`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>${C[goal()].n} roadmap · ${stage()} track</h3><span class="mu sm">${dn}/${rd.length} complete</span></div>${bar(pc(dn,rd.length))}<div class="tl mt">${rd.map(x=>`<div class="${x.done?'d':x===nt?'n':''}"><b>${x.t}</b> <span class="mu sm">· ${x.why}</span>${x===nt?` <button class="btn sm2" onclick="done(${JSON.stringify(x.t).replace(/"/g,'&quot;')})">Mark complete</button>`:''}</div>`).join('')}</div></div><div class="nav2"><button class="btn alt" onclick="go('gap')">← Skill Gaps</button><button class="btn" onclick="go('projects')">Next: Projects →</button></div>`}
function proj(){return`<div class="grid g2">${projects().map(p=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${p.t}</h3>${pill(p.d)}</div><div class="sm"><b>Problem:</b> ${p.pr}<br><b>Technologies:</b> ${p.T.join(', ')}<br><b>Skills learned:</b> ${p.sk.join(', ')}<br><b>Features:</b> ${p.f.join('; ')}<br><b>Steps:</b> ${p.st.map((s,i)=>(i+1)+'. '+s).join(' ')}<br><b>Outcome:</b> ${p.out}<br><b>Resume line:</b> <i>${p.rv}</i></div><div class="mt"><button class="btn sm2 alt" onclick="pj('${p.id}','doing')">Start</button> <button class="btn sm2" onclick="pj('${p.id}','done')">Mark done</button> <span class="sm">${S.pj[p.id]||''}</span></div></div>`).join('')}</div><div class="nav2"><button class="btn alt" onclick="go('roadmap')">← Roadmap</button><button class="btn" onclick="go('placement')">Next: Placement →</button></div>`}
function startTest(k){const Q=k=='apt'?aptQs():techQs();T={k,Q,A:{},t0:Date.now(),left:1200};clearInterval(TM);TM=setInterval(()=>{if(!T)return clearInterval(TM);T.left--;const e=$('tm');if(e)e.textContent=Math.floor(T.left/60)+':'+String(T.left%60).padStart(2,'0');if(T.left<=0)submitTest()},1000);render()}
window.startTest=startTest;window.ans=(i,j)=>{T.A[i]=j};
window.submitTest=()=>{clearInterval(TM);const tp={};T.Q.forEach((q,i)=>{tp[q.t]=tp[q.t]||[0,0];tp[q.t][1]++;if(T.A[i]===q.a)tp[q.t][0]++});const ok=Object.values(tp).reduce((a,x)=>a+x[0],0);S.sc[T.k]={pct:pc(ok,T.Q.length),topics:tp,time:Math.round((Date.now()-T.t0)/1e3),at:Date.now()};T.res=true;save();render()};
function testUI(k){if(!T||T.k!=k)return`<div class="card"><h3>${k=='apt'?'Aptitude Test':'Technical Test'}</h3><p class="sm mu">${k=='apt'?'15 questions: Quantitative, Logical and Verbal. 20-minute timer. Questions are newly generated each attempt.':'15 questions chosen for '+S.p.branch+', '+C[goal()].n+', your skills and weak topics. Different each attempt.'}</p><button class="btn" onclick="startTest('${k}')">Start test</button>${S.sc[k]?`<div class="mt sm">Last score: <b>${S.sc[k].pct}%</b> · ${Object.entries(S.sc[k].topics||{}).map(([a,b])=>a+' '+b[0]+'/'+b[1]).join(' · ')}</div>`:''}</div>`;
 if(T.res){const s=S.sc[k];return`<div class="card"><h3>Score: ${s.pct}% (${Object.values(s.topics).reduce((a,x)=>a+x[0],0)}/${T.Q.length} correct) · ${Math.floor(s.time/60)}m ${s.time%60}s of 20m</h3>${Object.entries(s.topics).map(([a,b])=>`<div class="sm">${a}: ${b[0]}/${b[1]}</div>${bar(pc(b[0],b[1]))}`).join('')}<div class="mt">${T.Q.map((q,i)=>`<div class="sm" style="margin:6px 0">${T.A[i]===q.a?'<span class="ok">✔</span>':'<span class="bad">✘</span>'} ${q.q} <span class="mu">→ ${q.o[q.a]}${T.A[i]!==q.a&&T.A[i]!=null?' (you: '+q.o[T.A[i]]+')':''}</span></div>`).join('')}</div><button class="btn mt" onclick="startTest('${k}')">New attempt</button></div>`}
 return`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${k=='apt'?'Aptitude':'Technical'} Test</h3><b>⏱ <span id="tm">${Math.floor(T.left/60)}:${String(T.left%60).padStart(2,'0')}</span></b></div>${T.Q.map((q,i)=>`<div style="margin:12px 0"><b class="sm">${i+1}. [${q.t}] ${q.q.replace(/</g,'&lt;')}</b>${q.o.map((o,j)=>`<label style="font-weight:400;color:var(--tx)"><input type="radio" style="width:auto" name="q${i}" onchange="ans(${i},${j})"> ${String(o).replace(/</g,'&lt;')}</label>`).join('')}</div>`).join('')}<button class="btn" onclick="submitTest()">Submit</button></div>`}
window.startCode=()=>{CS={P:codeSet(),t0:Date.now()};render()};
window.submitCode=()=>{const R=CS.P.map((p,i)=>runCode($('c'+i).value,p)),n=R.reduce((a,x)=>a+x.n,0),ok=R.reduce((a,x)=>a+x.pass,0);CS.R=R;S.sc.code={pct:pc(ok,n),time:Math.round((Date.now()-CS.t0)/1e3),at:Date.now()};save();render()};
function codeUI(){if(!CS)return`<div class="card"><h3>Coding Test</h3><p class="sm mu">3 problems (difficulty adapts to your skill level) with hidden test cases and automatic evaluation, run in your browser.</p><button class="btn" onclick="startCode()">Start coding test</button>${S.sc.code?`<div class="sm mt">Last: ${S.sc.code.pct}% in ${S.sc.code.time}s</div>`:''}</div>`;
 return`<div class="card">${CS.P.map((p,i)=>`<div style="margin-bottom:16px"><b>${i+1}. ${p[0]}</b> ${pill(p[2])}<div class="sm mu">${p[3]} Write <code>function ${p[1]}</code></div><textarea id="c${i}">function ${p[1]} {\n  \n}</textarea>${CS.R?`<div class="sm">${CS.R[i].pass}/${CS.R[i].n} tests passed ${CS.R[i].res.map(r=>r[0]?'✅':'❌ input '+r[1]+' expected '+r[2]+' got '+r[3]).join(' ')}</div>`:''}</div>`).join('')}${CS.R?`<h3>Score ${S.sc.code.pct}% · ${S.sc.code.time}s</h3><div class="sm">Analysis: ${S.sc.code.pct>=80?'Strong problem solving.':S.sc.code.pct>=50?'Good start — practise edge cases (empty inputs, negatives).':'Revise basics: loops, arrays, strings.'}</div><button class="btn mt" onclick="startCode()">New set</button>`:`<button class="btn" onclick="submitCode()">Submit & evaluate</button>`}</div>`}
window.ivStart=()=>{IV={i:0,a:[]};render()};window.ivNext=()=>{IV.a[IV.i]=$('ivt').value;if(IV.i<4){IV.i++;render()}else{IV.r=evalIv(IV.a);S.sc.int={pct:IV.r.pct,...IV.r};save();render()}};
function ivUI(){if(!IV)return`<div class="card"><h3>AI Mock Interview</h3><p class="sm mu">5 questions built from your profile, ${C[goal()].n} goal, skills, projects and your previous answers.</p><button class="btn" onclick="ivStart()">Start interview</button>${S.sc.int?`<div class="sm mt">Last: ${S.sc.int.pct}%</div>`:''}</div>`;

 if(n==7){const sl=skillList();h+=`<h3>Skills & tools: current level</h3><p class="sm mu">Skills required by your best-matching careers. Higher levels let the roadmap skip basics you already know.</p><div class="grid g3">${sl.map(x=>`<div><label>${esc(x)}</label>${lsel(x,lv(x))}</div>`).join('')}</div>`}

 return h+`<div class="nav2"><button class="btn alt" onclick="wiz(${n-1})" ${n==0?'disabled':''}>← Back</button><button class="btn alt" onclick="save();this.textContent='Saved ✓'">Save</button>${n<8?`<button class="btn" onclick="wiz(${n+1})">Next →</button>`:`<button class="btn" onclick="finish()">Save & See Career Match →</button>`}</div></div>`};

{const d1=dashV;dashV=()=>{const r=rmStat(),g=gaps().filter(x=>x.g>0)[0],m=matches().find(x=>x.id===r.id);return d1()+`<div class="card mt"><h3>AI recommendation</h3><div class="sm"><b>Roadmap ${r.pct}%</b> · ${r.dn}/${r.rd.length} topics · Current: <b>${r.cur?esc(r.cur.t):'complete'}</b> · Then: ${r.nxt?esc(r.nxt.t):'—'}</div><div class="sm mt">${g?'Biggest gap for <b>'+esc(C[r.id].n)+'</b>: <b>'+esc(g.k)+'</b> ('+g.cur+'/'+g.r+'). ':''}${m?esc(m.R.slice(0,2).join('. '))+'.':''}</div><div class="sm mu mt">Branch: ${esc(bk().ab)} · Assessment score: ${S.assessed?asm()+'%':'not completed'}</div></div>`}}
{const l1=landV;landV=()=>{let h=l1();if(S.assessed){const r=rmStat();h+=`<div class="card mt"><h3>Your roadmap preview · ${esc(C[r.id].n)}</h3><div class="sm">${r.dn}/${r.rd.length} topics · Next: <b>${r.cur?esc(r.cur.t):'complete'}</b></div>${bar(r.pct)}<button class="btn sm2 mt" onclick="go('dashboard')">Open dashboard</button></div>`}return h}}
{const m1=map;map=()=>{const r=rmStat(),c=C[r.id];return m1()+`<div class="card mt"><h3>${esc(bk().ab)} → ${esc(c.n)}: your generated map</h3><div class="tl">${r.rd.map(x=>`<div class="${x.done?'d':x===r.cur?'n':''}"><b>${esc(x.t)}</b> <span class="mu sm">${x.done?'✅ done':x===r.cur?'· you are here':''}</span></div>`).join('')}<div class="${r.cur?'':'d'}"><b>🎯 ${esc(c.n)}</b></div></div></div>`}}
// Weekly planner from roadmap + gaps + projects
window.plGen=()=>{const p=PL(),un=roadmap().filter(x=>!x.done),tp=un.slice(0,Math.max(2,Math.round(p.hrs/2.5))),h=Math.max(.5,Math.round(p.hrs/(tp.length*2+3)*2)/2),L=[],g=gaps().find(x=>x.g>0),pj=projects()[0];
 tp.forEach(x=>L.push({t:'Study: '+x.t,h},{t:'Practice questions: '+x.t,h}));if(g)L.push({t:'Lab / coding practice: '+g.k,h});L.push({t:'Project task: '+pj.t+' - '+pj.st[0],h},{t:'Interview prep: '+C[goal()].n+' questions',h},{t:'Self-assessment quiz: '+(tp[0]?tp[0].t:'weak topics'),h});
 L.forEach((x,i)=>{x.d=Math.floor(i*7/L.length);x.done=0});p.t=L;p.msg='';save();render()};

{const p1=placeV;placeV=()=>{const id=goal(),c=C[id],b=bk(),g=gaps().filter(x=>x.g>0).slice(0,4),sub=[...b.s].sort((x,y)=>lv(x)-lv(y)).slice(0,5),pj=projects()[0],a=asm(),x=S.pref&&S.pref.startsWith('x:')?S.pref.slice(2):'',cs=Object.keys(COMP()).map(n=>[n,companyView(n)]).filter(q=>q[1]).sort((u,v)=>v[1].prog-u[1].prog).slice(0,2),lang=['DSA','Python','Java','C/C++','JavaScript','SQL'].filter(k=>c.req[k]);
 return`<div class="card" style="margin-bottom:16px"><h3>Your placement plan · ${esc(b.ab)} → ${esc(c.n)}</h3><div class="sm"><b>Technical focus (skill gaps):</b> ${g.map(q=>esc(q.k)+' '+q.cur+'/'+q.r).join(', ')||'none'}<br><b>Branch-specific questions:</b> ${sub.map(esc).join(', ')}<br><b>Programming practice:</b> ${lang.join(', ')||'logic and scripting basics'}<br><b>Aptitude:</b> ${a<60?'45 min daily (assessment '+a+'%)':'20 min daily to stay sharp (assessment '+a+'%)'}<br><b>Mock interview:</b> projects, ${esc(g[0]?g[0].k:c.n)} fundamentals, HR (why ${esc(c.n)}, strengths, teamwork)<br><b>Companies that fit your skills:</b> ${cs.map(q=>esc(q[0])+' ('+q[1].prog+'%)').join('; ')||'select a target below'}<br><b>Resume:</b> lead with "${esc(pj.t)}" and only skills you truly have${x?'<br><b>Your stated path:</b> '+esc(x):''}</div></div>`+p1()}}

aiCtx=()=>{const r=rmStat(),c=C[r.id],m=matches(),me=m.find(x=>x.id===r.id)||{};return{name:S.p.name,branch:bk().n,year:S.p.year,semester:S.p.sem,cgpa:S.p.cgpa,interests:S.int,programmingInterests:S.prog,careerPreference:C[S.pref]?C[S.pref].n:S.pref,preferredWorkTypes:S.wk,skillLevels:Object.fromEntries(Object.entries(S.skills).filter(e=>e[1]>0).map(([k,v])=>[k,LVL[v]])),strongSubjects:S.strong,weakSubjects:S.weak,assessment:{score:asm(),problemSolving:S.ps,communication:S.comm,academicPercent:S.acad,tests:Object.fromEntries(Object.entries(S.sc).map(([k,v])=>[k,v.pct]))},careerMatch:{best:c.n,percent:me.pct,why:me.R,alternatives:m.filter(x=>x.id!==r.id).slice(0,3).map(x=>x.n+' '+x.pct+'%')},careerMap:r.rd.map(x=>x.t),skillGaps:gaps().filter(x=>x.g>0).slice(0,6).map(x=>x.k+' '+x.cur+'/'+x.r),roadmap:{progressPercent:r.pct,completed:r.rd.filter(x=>x.done).map(x=>x.t),currentTopic:r.cur&&r.cur.t,nextTopic:r.nxt&&r.nxt.t},projects:projects().map(p=>p.t+': '+(S.pj[p.id]||'not started')),placementReadinessPercent:placePct()}};

// ===== Google OAuth helpers =====
window.googleSignIn = () => { window.location.href = '/api/auth/google/start'; };

async function boot(){
  // Check if Google OAuth is configured (drives button visibility)
  AU.googleOk = false;
  fetch('/api/auth/google/status').then(r => r.json()).then(d => { AU.googleOk = !!d.configured; render(); }).catch(() => {});

  // Handle redirect-back from Google OAuth callback
  const hash = window.location.hash;
  if (hash.startsWith('#google_ok')) {
    // Google sign-in succeeded — clear hash then restore session
    history.replaceState(null, '', window.location.pathname);
    const u = await AuthAPI.session();
    if (u) { AU.user = u; KEY = GK + ':' + u.id; load(); await pullState(); AU.note = 'Signed in with Google. Welcome' + (u.name ? ', ' + u.name.split(' ')[0] : '') + '!'; S.seen = 1; S.view = 'account'; save(); render(); remSched(); return; }
  }
  if (hash.startsWith('#google_error')) {
    history.replaceState(null, '', window.location.pathname);
    const msg = decodeURIComponent(hash.replace('#google_error=', '')) || 'Google sign-in failed. Please try again.';
    AU.mode = 'login'; AU.note = msg;
  }

  const u = await AuthAPI.session();
  if (u) { AU.user = u; KEY = GK + ':' + u.id; }
  load();
  if (u) await pullState();
  render();
  remSched();
}
boot();

}
